# ─────────────────────────────────────────────────────────────────────────────
#  svc-llm — Gemma 4 local cu Open WebUI
#  Hardware tinta: Intel i7-8550U, 24 GB RAM, fara GPU dedicat
#  Model recomandat: gemma4:4b  (~6 GB RAM, ~8-15 tok/s pe CPU)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama — server de inferenta ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_NUM_THREAD=4
      - DEFAULT_MODEL=gemma3:4b
    networks:
      - docker-network
    # Limita RAM pentru a nu bloca OS-ul (lasa ~8 GB pentru sistem)
    mem_limit: 14g
    memswap_limit: 14g

    # ── Decomentati pentru GPU NVIDIA (nu se aplica pe acest laptop) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Open WebUI — interfata web chat ──────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: llm-open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-local-dev-secret}
      - WEBUI_NAME=Gemma 4 Local Chat
      - DEFAULT_MODELS=${OLLAMA_MODEL:-gemma3:4b}
      - ENABLE_SIGNUP=true
      # Dezactiveaza autentificare externa
      - ENABLE_OAUTH_SIGNUP=false
      - ENABLE_COMMUNITY_SHARING=false
    depends_on:
      - ollama
    networks:
      - docker-network

  # ── Nginx — reverse proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - open-webui
    networks:
      - docker-network

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  ollama_models:
    name: llm-ollama-models
  open_webui_data:
    name: llm-open-webui-data

networks:
  docker-network:
    external: true
    name: ragprojects_docker-network
