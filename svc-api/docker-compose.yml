version: "3.9"

services:
  graphdb:
    image: ontotext/graphdb:11.3.0
    container_name: smarthome-graphdb
    ports:
      - "7200:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
      - ./graphDB.license:/opt/graphdb/home/conf/graphdb.license:ro
    environment:
      GDB_HEAP_SIZE: "2g"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5

